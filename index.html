<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Андрей & Елена — Свадьба</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<!-- Вот сюда вставь ссылку на свой styles.css -->
<link rel="stylesheet" href="styles.css">

<!-- ← СЮДА ВСТАВЬ СВОЙ URL ИЗ APPS SCRIPT (шаг 7 выше) -->
<!-- <script> const SCRIPT_URL = 'https://script.google.com/macros/s/ВАШ_ДЛИННЫЙ_ID/exec'; </script> -->
</head>
<body>

<!-- ... весь твой контент (header, sections, program, location, dresscode) остаётся без изменений ... -->

<section class="form-section">
<div class="container">
<h2>Анкета гостя</h2>
<p style="margin-bottom:2.5rem;">Подтвердите свое присутствие и ответьте на несколько вопросов. Это поможет в организации торжества!</p>

<form id="guestForm" onsubmit="handleSubmit(event)">
<label>Ваше имя *</label>
<input type="text" name="name" required>

<label>Сможете ли Вы присутствовать? *</label>
<select name="attend" required>
<option value="">Выберите...</option>
<option value="yes">Да, с удовольствием!</option>
<option value="with-plus">Да, +1</option>
<option value="no">К сожалению, нет</option>
</select>

<label>Предпочтения по напиткам (можно несколько)</label>
<div class="checkbox-group">
<label><input type="checkbox" name="drinks" value="wine"> Вино</label>
<label><input type="checkbox" name="drinks" value="strong"> Крепкие напитки</label>
<label><input type="checkbox" name="drinks" value="beer"> Пиво</label>
<label><input type="checkbox" name="drinks" value="non-alco"> Безалкогольные</label>
</div>

<label>Пожелания / аллергии / вопросы</label>
<textarea name="message" rows="4"></textarea>

<button type="submit">Отправить ответ</button>
</form>

<div id="formMessage" style="margin-top:1.5rem; font-weight:500; min-height:1.5em;"></div>

<div class="contacts">
<p>По всем вопросам пишите:</p>
<p><strong>Елена</strong> — +7 (XXX) XXX-XX-XX<br>
<strong>Андрей</strong> — +7 (XXX) XXX-XX-XX<br>
или в Telegram @yourhandle</p>
</div>
</div>
</section>

<footer>
<p>С любовью, Андрей и Елена<br>Photo: @soulsandcolors</p>
</footer>

<script>
// ← ВСТАВЬ СВОЙ URL СЮДА (тот, который скопировал из развертывания)
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyTuxljwkoxLXWh27ZGUrW9h-edsyCu5QrjIseAUNFs9n2NsEfIZNXVVNEHj35PDzCTvw/exec';

function handleSubmit(event) {
event.preventDefault();

const form = document.getElementById('guestForm');
const messageDiv = document.getElementById('formMessage');
messageDiv.textContent = 'Отправка...';
messageDiv.style.color = '#555';

// Собираем данные
const formData = new FormData(form);
const data = {};
for (const [key, value] of formData.entries()) {
if (key === 'drinks') {
if (!data.drinks) data.drinks = [];
data.drinks.push(value);
} else {
data[key] = value;
}
}
data.drinks = JSON.stringify(data.drinks || []);

fetch(SCRIPT_URL, {
method: 'POST',
mode: 'no-cors',          // важно для Google Apps Script
headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
body: new URLSearchParams(data)
})
.then(() => {
// no-cors не даёт прочитать ответ, поэтому считаем успехом
messageDiv.textContent = 'Спасибо! Ваши данные записаны.';
messageDiv.style.color = 'green';
form.reset();
})
.catch(err => {
console.error(err);
messageDiv.textContent = 'Ошибка отправки. Попробуйте позже или напишите нам напрямую.';
messageDiv.style.color = 'red';
});
}
</script>

</body>
</html>
