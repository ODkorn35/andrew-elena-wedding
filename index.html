<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Андрей & Елена — приглашение</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- HERO -->
  <section class="hero">
    <div class="hero__content">
      <p class="hero__subtitle">Мы женимся</p>
      <h1 class="hero__title">Андрей & Елена</h1>
      <p class="hero__date">26.06.2026</p>
    </div>
  </section>

  <!-- INVITATION TEXT -->
  <section class="invitation">
    <p>
      Дорогие гости!  
      Мы будем рады разделить с вами самый важный день нашей жизни.
    </p>
  </section>

  <!-- DETAILS -->
  <section class="details">
    <div class="details__item">
      <h3>Дата</h3>
      <p>26 июня 2026</p>
    </div>
    <div class="details__item">
      <h3>Формат</h3>
      <p>Свадебное торжество</p>
    </div>
  </section>

  <!-- RSVP -->
  <section class="rsvp">
    <h2>Подтвердите присутствие</h2>

    <form id="rsvpForm">
      <input type="text" name="name" placeholder="Ваше имя" required>

      <select name="attendance" required>
        <option value="">Вы сможете прийти?</option>
        <option value="Да">Да, с удовольствием</option>
        <option value="Нет">К сожалению, не смогу</option>
      </select>

      <textarea name="comment" placeholder="Комментарий (по желанию)"></textarea>

      <button type="submit">Отправить</button>
    </form>

    <p id="formStatus" class="form-status"></p>
  </section>

  <script src="js/rsvp.js"></script>
</body>
</html>
